name: 插件构建与回归

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - name: 从公开依赖安装
        run: pnpm install --frozen-lockfile
      - id: matrix
        name: 核对单一兼容策略并输出矩阵
        run: echo "value=$(node scripts/dsh-compatibility.mjs matrix)" >> "$GITHUB_OUTPUT"
      - name: 检查 Git 安装入口、SDK 导入及源码与产物一致性
        run: |
          pnpm verify:package
          pnpm build
          git diff --exit-code -- dist
          node --input-type=module -e "await import('./dist/index.js')"
      - name: 类型与行为回归
        run: |
          pnpm typecheck
          pnpm test:unit
          pnpm test:integration
      - name: 发行入口检查
        run: pnpm verify:package
      - name: 检查实际安装包
        run: |
          pnpm pack --out "${RUNNER_TEMP}/dsh-test-plugin.tgz"
          mkdir "${RUNNER_TEMP}/plugin-package"
          tar -xzf "${RUNNER_TEMP}/dsh-test-plugin.tgz" -C "${RUNNER_TEMP}/plugin-package"
          node scripts/check-package.mjs "${RUNNER_TEMP}/plugin-package/package"
          cd "${RUNNER_TEMP}"
          sha256sum dsh-test-plugin.tgz > dsh-test-plugin.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate
          path: |
            ${{ runner.temp }}/dsh-test-plugin.tgz
            ${{ runner.temp }}/dsh-test-plugin.sha256

  host:
    needs: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plugin.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v${{ matrix.host }}
          path: host-source
          fetch-depth: 1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 安装 MCP 与报告验证各自匹配的 Chromium
        run: node scripts/install-browser.mjs
      - name: 无凭据、未选工作区与慢启动浏览器回归
        run: node --test tests/browser/compat-browser.test.mjs
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - name: 同一候选包的无豁免安装、SDK 回归与真实 Web
        env:
          DSH_NPM_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          cd "${RUNNER_TEMP}/candidate"
          sha256sum --check dsh-test-plugin.sha256
          export DSH_CANDIDATE_SHA256=$(cut -d ' ' -f 1 dsh-test-plugin.sha256)
          cd "${GITHUB_WORKSPACE}"
          pnpm compat:host "${{ matrix.host }}" "${RUNNER_TEMP}/candidate/dsh-test-plugin.tgz" host-source "${RUNNER_TEMP}/host-check"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: host-${{ matrix.host }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/host-check/summary.json
            ${{ runner.temp }}/host-check/*sdk.json
            ${{ runner.temp }}/host-check/regression.json
            ${{ runner.temp }}/host-check/web-*.json
            ${{ runner.temp }}/host-check/web-*.png
            ${{ runner.temp }}/host-check/cohort/package-lock.json
            ${{ runner.temp }}/host-check/public/package-lock.json
            ${{ runner.temp }}/host-check/profile-locks/**

  compatibility:
    name: 全部支持宿主通过
    needs: [plugin, host]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          BUILD_RESULT: ${{ needs.plugin.result }}
          HOST_RESULT: ${{ needs.host.result }}
        run: test "$BUILD_RESULT" = success && test "$HOST_RESULT" = success

  release:
    name: 发布版本安装包
    needs: compatibility
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - name: 核对标签并发布已验证的候选包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "${RUNNER_TEMP}/candidate"
          sha256sum --check dsh-test-plugin.sha256
          package_version=$(tar -xOzf dsh-test-plugin.tgz package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          repository_version=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.GITHUB_WORKSPACE + "/package.json", "utf8")).version')
          test "$RELEASE_TAG" = "v${repository_version}"
          test "$package_version" = "$repository_version"
          release_archive="dsh-test-plugin-${package_version}.tgz"
          cp dsh-test-plugin.tgz "$release_archive"
          sha256sum "$release_archive" > "${release_archive}.sha256"
          release_flags=()
          if [[ "$package_version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$release_archive" "${release_archive}.sha256" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${release_flags[@]}"
