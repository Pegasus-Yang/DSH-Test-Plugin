name: dsh-gitlab-demo

services:
  gitlab:
    image: gitlab/gitlab-ce:19.4.1-ce.0
    hostname: gitlab.local
    restart: unless-stopped
    shm_size: '256m'
    environment:
      TZ: Asia/Shanghai
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
    ports:
      - '127.0.0.1:8929:8929'
      - '127.0.0.1:2424:22'
    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

volumes:
  gitlab-data:
